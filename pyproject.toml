[tool.poetry]
name = "viewsets_and_generics"
version = "0.1.0"
description = "Django REST API with Celery, PostgreSQL, JWT, Swagger, Stripe"
authors = ["Maksim Pestov <moikry@mail.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
django = "^5.1"
djangorestframework = "^3.16.1"
django-filter = "^25.1"
psycopg2-binary = "^2.9"
celery = "^5.3"
django-celery-beat = "^2.5"
djangorestframework-simplejwt = "^5.3"
drf-spectacular = "^0.27.1"
stripe = "^8.0"
python-dotenv = "^1.0"
pillow = "^11.3.0"
django-redis = "^5.4.0"  # ✅ добавлено для Redis-кэша
tzdata = { version = "*", markers = "sys_platform == 'win32'" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-django = "^4.8"
coverage = "^7.5"
black = "^24.4"
flake8 = "^7.0"
isort = "^5.13"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
