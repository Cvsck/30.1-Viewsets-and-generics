name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: education_db
          POSTGRES_USER: education_user
          POSTGRES_PASSWORD: education_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U education_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: education_db
      DB_USER: education_user
      DB_PASSWORD: education_pass
      DB_HOST: localhost
      DB_PORT: 5432

    strategy:
      matrix:
        python-version: [3.11]  # ✅ соответствует твоей VM

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            nc -z localhost 5432 && echo "PostgreSQL is up" && break
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests
        run: poetry run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "📦 Pulling latest code..."
            cd /home/maksim_1983/app
            git reset --hard HEAD
            git pull origin develop

            echo "🧹 Stopping containers..."
            docker-compose down

            echo "🚀 Rebuilding and starting containers..."
            docker-compose up -d --build

            echo "🧪 Running migrations and collecting static..."
            docker-compose exec -T web python manage.py migrate
            docker-compose exec -T web python manage.py collectstatic --noinput

            echo "✅ Deploy finished"
